# Configuración de la AI Software Factory para este repositorio.

[project]
base_branch = "master"
# Lo mismo que la CI (.github/workflows/ci.yml): lint de skills, guardas de seguridad,
# tests Python y, en cada CLI de portal, typecheck + tests de Bun.
# Requiere python3 con pyyaml y openpyxl, y bun en el PATH.
test_command = 'python3 tools/lint_skills.py && python3 tools/security_guards.py && python3 -m unittest discover -s tests -t . && for d in .agents/skills/*/cli; do (cd "$d" && bun install --silent && bun run typecheck && bun test) || exit 1; done'
lint_command = ""             # el lint ya va dentro de test_command
command_timeout = 900         # segundos por comando

# ---------------------------------------------------------------------------
# PROVEEDORES DE IA Y API KEYS
# ---------------------------------------------------------------------------
# Aquí NUNCA va la clave en sí (este archivo se sube a git). Sólo el NOMBRE de la
# variable de entorno que la contiene:
#   - local: en el archivo .env de la factoría  (OPENAI_API_KEY=sk-...)
#   - CI:    en Settings → Secrets del repo, y añadida al workflow
# Comprueba la configuración con:  python main.py providers --repo . --ping
#
# Tipos:
#   "anthropic" → API de Claude. Obligatorio para spec_writer y builder.
#   "openai"    → OpenAI o cualquier API compatible (con base_url). Sólo para revisores y approver.
#
# Uso en [models]: "<nombre_proveedor>:<modelo>". Sin prefijo = proveedor "anthropic".

[providers.anthropic]
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
# base_url = ""                       # opcional: proxy o gateway propio

# NVIDIA (build.nvidia.com) — API compatible con OpenAI. Activo por defecto para
# revisores y approver. Clave en NVIDIA_API_KEY (empieza por "nvapi-").
[providers.nvidia]
type = "openai"
api_key_env = "NVIDIA_API_KEY"
base_url = "https://integrate.api.nvidia.com/v1"
json_mode = "prompt"                  # schema en las instrucciones + validación y reintento
supports_images = false               # nemotron-3-super sólo acepta texto

# Descomenta los que vayas a usar:

