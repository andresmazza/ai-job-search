# Varias cuentas del mismo proveedor (p. ej. facturar revisiones aparte):
# [providers.anthropic_reviews]
# type = "anthropic"
# api_key_env = "ANTHROPIC_API_KEY_REVIEWS"

[models]
# Usa el ID de modelo exacto que publica cada proveedor en su documentación.
spec_writer = "claude-opus-5-5"
builder = "claude-opus-5-5"
approver = "nvidia:nvidia/nemotron-3-super-120b-a12b"
# Revisores y approver en NVIDIA: un proveedor distinto al del Builder evita el sesgo de
# auto-evaluación. Para volver a Claude: "claude-sonnet-5-5" (revisores) / "claude-opus-5-5" (approver).
# Catálogo de modelos NVIDIA: https://build.nvidia.com/models
reviewer_security = "nvidia:nvidia/nemotron-3-super-120b-a12b"
reviewer_code_quality = "nvidia:nvidia/nemotron-3-super-120b-a12b"
reviewer_ux = "nvidia:nvidia/nemotron-3-super-120b-a12b"
reviewer_ui = "nvidia:nvidia/nemotron-3-super-120b-a12b"

[effort]                      # low | medium | high | xhigh | max
spec_writer = "high"
builder = "high"
reviewers = "medium"
approver = "medium"

[pipeline]
max_iterations = 3            # ciclos Builder → Revisores → Approver antes de rendirse
builder_max_turns = 80
spec_max_turns = 30
require_red_phase = true      # exige ver los tests fallar antes de pasar (TDD)
use_fallbacks = true          # reintento automático en otro modelo si un clasificador rechaza

[reviewers]
enabled = ["security", "code_quality", "ux", "ui"]
# UX y UI sólo se lanzan si el diff toca alguno de estos archivos:
# Este proyecto no tiene frontend: UX y UI no se lanzan.
frontend_globs = []
# Comando opcional que genera capturas PNG para el revisor de UI (p. ej. un script Playwright):
ui_screenshot_command = ""
ui_screenshot_dir = ".ai_factory/screenshots"

[risk]
# Cualquier cambio que toque estas rutas va por PR con revisión humana (glob, '*' cruza carpetas).
critical_paths = [
  # Permisos y superficie de seguridad
  ".claude/settings.json", ".claude/agents/*", ".gitignore", "SECURITY.md",
  "tools/security_guards.py", "tools/posting_guard.py", "tools/robots_check.py",
  ".github/*",
  # Perfil y datos personales (repo público)
  "CLAUDE.md", "AGENTS.md", ".claude/skills/job-application-assistant/01-*",
  ".claude/skills/job-application-assistant/02-*", "cv/*", "cover_letters/*",
  # Dependencias de los CLIs
  "*package.json", "*tsconfig.json",
  "*.env*",
]
max_lines_low_risk = 200
max_files_low_risk = 10

[delivery]
auto_merge = true             # bajo riesgo: merge --no-ff a la rama base
auto_push = false             # además hacer push de la rama base tras el merge
remote = "origin"
